<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Second Rise — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; }

  /* ── Login ── */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: #fff; border-radius: 20px; padding: 40px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
  .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: #888; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 12px 14px; border: 2px solid #e5e5ea; border-radius: 10px; font-size: 15px; outline: none; margin-bottom: 12px; }
  .login-card input:focus { border-color: #3b1a5a; }
  .login-card button { width: 100%; padding: 13px; background: #3b1a5a; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .login-card button:hover { background: #5a2d82; }
  .login-error { color: #c0392b; font-size: 13px; margin-top: 8px; }

  /* ── App shell ── */
  #app { display: none; }
  .topbar { background: #3b1a5a; color: #fff; padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
  .topbar span { font-size: 13px; opacity: 0.7; }
  .topbar button { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .topbar button:hover { background: rgba(255,255,255,0.25); }

  .tabs { display: flex; gap: 0; background: #fff; border-bottom: 1px solid #e5e5ea; padding: 0 28px; }
  .tab { padding: 14px 20px; font-size: 14px; font-weight: 600; color: #888; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; }
  .tab.active { color: #3b1a5a; border-bottom-color: #3b1a5a; }
  .tab:hover:not(.active) { color: #555; }

  .content { padding: 28px; max-width: 1100px; margin: 0 auto; }

  /* ── Stats cards ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .stat-card .num { font-size: 32px; font-weight: 700; color: #3b1a5a; }
  .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }

  /* ── Tables ── */
  .table-wrap { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .table-header { padding: 18px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .table-header h2 { font-size: 15px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 11px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #888; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
  td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #f5f5f7; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  /* ── Badges ── */
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-green { background: #d4edda; color: #155724; }
  .badge-gray  { background: #e9ecef; color: #495057; }
  .badge-purple{ background: #e8d5f5; color: #5a2d82; }

  /* ── Buttons ── */
  .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #3b1a5a; color: #fff; }
  .btn-danger  { background: #fee2e2; color: #c0392b; }
  .btn-sm      { padding: 5px 11px; font-size: 12px; }

  /* ── Modal ── */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 18px; padding: 28px; width: 500px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 2px solid #e5e5ea; border-radius: 9px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3b1a5a; }
  .form-group textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── Search ── */
  .search-input { padding: 8px 14px; border: 2px solid #e5e5ea; border-radius: 9px; font-size: 13px; outline: none; width: 220px; }
  .search-input:focus { border-color: #3b1a5a; }

  .empty { text-align: center; padding: 48px; color: #aaa; font-size: 14px; }
  .loading { text-align: center; padding: 32px; color: #aaa; }
</style>
</head>
<body>

<!-- ── Login screen ── -->
<div id="login-screen">
  <div class="login-card">
    <h1>🌅 Second Rise Admin</h1>
    <p>Enter your admin password to continue.</p>
    <input type="password" id="secret-input" placeholder="Admin password" />
    <button onclick="doLogin()">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <div class="topbar">
    <h1>🌅 Second Rise Admin</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <span id="last-refresh"></span>
      <button onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('dashboard')">Dashboard</div>
    <div class="tab" onclick="switchTab('users')">Users</div>
    <div class="tab" onclick="switchTab('resources')">Resources</div>
  </div>

  <!-- Dashboard -->
  <div id="tab-dashboard" class="content">
    <div class="stats-grid" id="stats-grid">
      <div class="loading">Loading…</div>
    </div>
  </div>

  <!-- Users -->
  <div id="tab-users" class="content" style="display:none">
    <div class="table-wrap">
      <div class="table-header">
        <h2>All Users</h2>
        <input class="search-input" type="text" placeholder="Search email…" oninput="filterUsers(this.value)" />
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Email</th><th>Signed up</th><th>Stage</th>
            <th>Onboarded</th><th>Check-ins</th><th>Workouts</th><th>Last active</th><th></th>
          </tr>
        </thead>
        <tbody id="users-tbody"><tr><td colspan="9" class="loading">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Resources -->
  <div id="tab-resources" class="content" style="display:none">
    <div class="table-wrap">
      <div class="table-header">
        <h2>Wellness Resources</h2>
        <button class="btn btn-primary" onclick="openResourceModal()">+ Add resource</button>
      </div>
      <table>
        <thead>
          <tr><th>Title</th><th>Type</th><th>Author</th><th>Featured</th><th>Active</th><th></th></tr>
        </thead>
        <tbody id="resources-tbody"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Resource modal -->
<div class="modal-bg" id="resource-modal">
  <div class="modal">
    <h2 id="modal-title">Add Resource</h2>
    <input type="hidden" id="res-id" />
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="res-title" placeholder="e.g. The Galveston Diet Podcast" />
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="res-type">
        <option value="article">Article</option>
        <option value="podcast">Podcast</option>
        <option value="video">Video</option>
        <option value="book">Book / Guide</option>
        <option value="tool">Tool / Calculator</option>
      </select>
    </div>
    <div class="form-group">
      <label>Author / Source</label>
      <input type="text" id="res-author" placeholder="e.g. Dr. Mary Claire Haver" />
    </div>
    <div class="form-group">
      <label>URL *</label>
      <input type="url" id="res-url" placeholder="https://…" />
    </div>
    <div class="form-group">
      <label>Description (max 200 chars)</label>
      <textarea id="res-desc" maxlength="200" placeholder="Brief description shown to users…"></textarea>
    </div>
    <div class="form-group">
      <label>Tags (comma-separated)</label>
      <input type="text" id="res-tags" placeholder="hormones, fitness, nutrition" />
    </div>
    <div class="form-group">
      <label>Thumbnail URL (optional)</label>
      <input type="url" id="res-thumbnail" placeholder="https://… (image shown on card)" />
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:10px">
      <input type="checkbox" id="res-featured" style="width:auto" />
      <label for="res-featured" style="text-transform:none;font-size:14px;font-weight:500">Feature this resource (shown at the top)</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closeResourceModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveResource()">Save</button>
    </div>
  </div>
</div>

<script>
const BASE = window.location.origin;
let SECRET = '';
let allUsers = [];
let allResources = [];

// ── Auth ──────────────────────────────────────────────────────────────────────
function doLogin() {
  const s = document.getElementById('secret-input').value.trim();
  if (!s) return;
  SECRET = s;
  sessionStorage.setItem('adminSecret', s);
  verifyAndLoad();
}
document.getElementById('secret-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function logout() {
  SECRET = '';
  sessionStorage.removeItem('adminSecret');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('secret-input').value = '';
}

async function verifyAndLoad() {
  try {
    const r = await api('/admin/stats');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderStats(r);
    loadUsers();
    loadResources();
    document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch {
    document.getElementById('login-error').textContent = 'Wrong password.';
    SECRET = '';
    sessionStorage.removeItem('adminSecret');
  }
}

// Auto-login if secret in sessionStorage
const saved = sessionStorage.getItem('adminSecret');
if (saved) { SECRET = saved; verifyAndLoad(); }

// ── API helper ────────────────────────────────────────────────────────────────
async function api(path, options = {}) {
  const res = await fetch(BASE + '/api' + path, {
    ...options,
    headers: { 'X-Admin-Secret': SECRET, 'Content-Type': 'application/json', ...(options.headers || {}) },
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(name) {
  ['dashboard','users','resources'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === name ? 'block' : 'none';
    document.querySelectorAll('.tab')[['dashboard','users','resources'].indexOf(t)].classList.toggle('active', t === name);
  });
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderStats(d) {
  const items = [
    { num: d.total_users,    label: 'Total users' },
    { num: d.new_this_week,  label: 'New this week' },
    { num: d.new_this_month, label: 'New this month' },
    { num: d.checkins_today, label: 'Check-ins today' },
    { num: d.total_checkins, label: 'Total check-ins' },
    { num: d.total_workouts, label: 'Total workouts logged' },
  ];
  document.getElementById('stats-grid').innerHTML = items.map(i => `
    <div class="stat-card">
      <div class="num">${i.num}</div>
      <div class="label">${i.label}</div>
    </div>
  `).join('');
}

// ── Users ─────────────────────────────────────────────────────────────────────
async function loadUsers() {
  const data = await api('/admin/users');
  allUsers = data.users;
  renderUsers(allUsers);
}

function renderUsers(users) {
  if (!users.length) {
    document.getElementById('users-tbody').innerHTML = '<tr><td colspan="9" class="empty">No users yet.</td></tr>';
    return;
  }
  document.getElementById('users-tbody').innerHTML = users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${u.email}</td>
      <td>${fmt(u.created_at)}</td>
      <td>${u.menopause_stage ? badge(u.menopause_stage, 'purple') : '—'}</td>
      <td>${u.onboarding_complete ? badge('Yes','green') : badge('No','gray')}</td>
      <td>${u.total_checkins}</td>
      <td>${u.total_workouts}</td>
      <td>${u.last_checkin ? fmt(u.last_checkin) : '—'}</td>
      <td>
        <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id},'${u.email}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function filterUsers(q) {
  const filtered = allUsers.filter(u => u.email.toLowerCase().includes(q.toLowerCase()));
  renderUsers(filtered);
}

async function deleteUser(id, email) {
  if (!confirm(`Permanently delete user ${email}? This cannot be undone.`)) return;
  await api('/admin/users/' + id, { method: 'DELETE' });
  allUsers = allUsers.filter(u => u.id !== id);
  renderUsers(allUsers);
}

// ── Resources ─────────────────────────────────────────────────────────────────
async function loadResources() {
  const data = await api('/admin/resources');
  allResources = data.resources;
  renderResources(allResources);
}

function renderResources(resources) {
  if (!resources.length) {
    document.getElementById('resources-tbody').innerHTML = '<tr><td colspan="6" class="empty">No resources yet. Add one above.</td></tr>';
    return;
  }
  document.getElementById('resources-tbody').innerHTML = resources.map(r => `
    <tr>
      <td><a href="${r.url}" target="_blank" style="color:#3b1a5a;font-weight:600">${r.title}</a></td>
      <td>${badge(r.type,'gray')}</td>
      <td>${r.author || '—'}</td>
      <td>${r.featured ? badge('Featured','purple') : '—'}</td>
      <td>${r.active ? badge('Active','green') : badge('Hidden','gray')}</td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-primary btn-sm" onclick="editResource(${r.id})">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="removeResource(${r.id})">Delete</button>
      </td>
    </tr>
  `).join('');
}

function openResourceModal(id) {
  document.getElementById('modal-title').textContent = id ? 'Edit Resource' : 'Add Resource';
  document.getElementById('res-id').value = id || '';
  if (!id) {
    ['res-title','res-author','res-url','res-desc','res-tags','res-thumbnail'].forEach(f => document.getElementById(f).value = '');
    document.getElementById('res-type').value = 'article';
    document.getElementById('res-featured').checked = false;
  }
  document.getElementById('resource-modal').classList.add('open');
}

function editResource(id) {
  const r = allResources.find(x => x.id === id);
  if (!r) return;
  document.getElementById('res-id').value = r.id;
  document.getElementById('res-title').value = r.title;
  document.getElementById('res-type').value = r.type;
  document.getElementById('res-author').value = r.author || '';
  document.getElementById('res-url').value = r.url;
  document.getElementById('res-desc').value = r.description || '';
  document.getElementById('res-tags').value = (JSON.parse(r.tags || '[]')).join(', ');
  document.getElementById('res-thumbnail').value = r.thumbnail_url || '';
  document.getElementById('res-featured').checked = !!r.featured;
  document.getElementById('modal-title').textContent = 'Edit Resource';
  document.getElementById('resource-modal').classList.add('open');
}

function closeResourceModal() {
  document.getElementById('resource-modal').classList.remove('open');
}

async function saveResource() {
  const id = document.getElementById('res-id').value;
  const body = {
    title:       document.getElementById('res-title').value.trim(),
    type:        document.getElementById('res-type').value,
    author:      document.getElementById('res-author').value.trim(),
    url:         document.getElementById('res-url').value.trim(),
    description: document.getElementById('res-desc').value.trim(),
    tags:          document.getElementById('res-tags').value.split(',').map(t => t.trim()).filter(Boolean),
    thumbnail_url: document.getElementById('res-thumbnail').value.trim() || null,
    featured:      document.getElementById('res-featured').checked,
    active:      true,
  };
  if (!body.title || !body.url) { alert('Title and URL are required.'); return; }

  if (id) {
    await api('/admin/resources/' + id, { method: 'PUT', body });
  } else {
    await api('/admin/resources', { method: 'POST', body });
  }
  closeResourceModal();
  await loadResources();
}

async function removeResource(id) {
  if (!confirm('Delete this resource?')) return;
  await api('/admin/resources/' + id, { method: 'DELETE' });
  await loadResources();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function badge(text, color) {
  return `<span class="badge badge-${color}">${text}</span>`;
}
</script>
</body>
</html>
